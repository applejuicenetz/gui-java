id: io.github.applejuicenetz.javagui
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ajgui
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
build-options:
  no-debuginfo: true
finish-args:
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=~/appleJuice:create
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh
  - name: binary
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/io.github.applejuicenetz.javagui
      - cp -a payload/. /app/share/io.github.applejuicenetz.javagui/
    sources:
      - type: dir
        path: ../target/distribution
        dest: payload
  - name: starter
    buildsystem: simple
    build-commands:
      - install -Dm755 io.github.applejuicenetz.javagui.sh /app/bin/ajgui
    sources:
      - type: file
        path: javagui/io.github.applejuicenetz.javagui.sh
  - name: icon
    buildsystem: simple
    build-commands:
      - install -Dm644 AJCoreGUI.png /app/share/icons/hicolor/512x512/apps/io.github.applejuicenetz.javagui.png
    sources:
      - type: file
        path: ../assets/linux/AJCoreGUI.png
  - name: desktop-file
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.applejuicenetz.javagui.desktop /app/share/applications/io.github.applejuicenetz.javagui.desktop
    sources:
      - type: file
        path: javagui/io.github.applejuicenetz.javagui.desktop
  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.applejuicenetz.javagui.metainfo.xml /app/share/metainfo/io.github.applejuicenetz.javagui.metainfo.xml
    sources:
      - type: file
        path: javagui/io.github.applejuicenetz.javagui.metainfo.xml
  - name: gui-ajl-mime
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.applejuicenetz.javagui.mime.xml /app/share/mime/packages/io.github.applejuicenetz.javagui.xml
    sources:
      - type: file
        path: javagui/io.github.applejuicenetz.javagui.mime.xml

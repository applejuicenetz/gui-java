name: release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'build/javagui-*'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: amd64
            type: dmg
          - runner: macos-15
            platform: macos
            arch: aarch64
            type: dmg
          - runner: windows-2025
            platform: windows
            arch: amd64
            type: exe
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
            type: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install WiX 3 for JDK 21 jpackage
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314.zip'
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') {
            throw 'WiX archive checksum mismatch'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive $archive -DestinationPath $tools
          $tools >> $env:GITHUB_PATH

      - name: Build JAR and native installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_TYPE: ${{ matrix.type }}
        run: |
          set -euo pipefail
          mvn -B clean package
          version="$(python -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().findtext('version'))")"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$version" = "${GITHUB_REF_NAME#v}"
          fi
          python scripts/package.py native \
            --platform "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH" --type "$PACKAGE_TYPE"

      - name: Test Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python scripts/test_windows_installer.py target/AJCoreGUI-windows-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/AJCoreGUI-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.type }}
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            package-arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            package-arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Flatpak builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder xvfb xauth
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build JAR and Flatpak bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLATPAK_ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package-arch }}
        run: |
          set -euo pipefail
          xvfb-run -a mvn -B clean package
          python scripts/package.py prepare
          version="$(python -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().findtext('version'))")"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$version" = "${GITHUB_REF_NAME#v}"
          fi
          release_date="$(date -u +%F)"
          sed -i -E "s|<release version=\"[^\"]+\" type=\"stable\" date=\"[^\"]+\"/>|<release version=\"$version\" type=\"stable\" date=\"$release_date\"/>|" \
            flatpak/javagui/io.github.applejuicenetz.javagui.metainfo.xml
          flatpak-builder \
            --arch="$FLATPAK_ARCH" \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --force-clean \
            --repo=target/flatpak-repo \
            --default-branch=stable \
            target/flatpak-build \
            flatpak/io.github.applejuicenetz.javagui.yaml
          flatpak build-bundle \
            --arch="$FLATPAK_ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            target/flatpak-repo \
            "target/AJCoreGUI-linux-${PACKAGE_ARCH}.flatpak" \
            io.github.applejuicenetz.javagui stable
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.package-arch }}
          path: target/AJCoreGUI-linux-${{ matrix.package-arch }}.flatpak
          if-no-files-found: error

  archive32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86
            file: bellsoft-jre21.0.12.1+1-windows-i586.zip
            sha256: 5dfc687e12cc9d00a55542cdf9eb1e8b7abb26b0bf43ea929d49d9f0be6106e4
          - platform: linux
            arch: x86
            file: bellsoft-jre21.0.12.1+1-linux-i586.tar.gz
            sha256: 386c795617217ace46b9acb1ba1a40c604b8c753d9c121972a496a62d95cd305
          - platform: linux
            arch: armhf
            file: bellsoft-jre21.0.12.1+1-linux-arm32-vfp-hflt.tar.gz
            sha256: 61b1a07a4caeaa68e75a7b5f4a599a8411ad26406e21a3f684a547a38af0a0a5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build payload and bundled 32-bit archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_FILE: ${{ matrix.file }}
          RUNTIME_SHA256: ${{ matrix.sha256 }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a mvn -B clean package
          python scripts/package.py prepare
          python -m unittest discover -s scripts -p 'test_archive.py'
          mkdir -p target/runtime32
          curl --fail --location --retry 3 "https://github.com/bell-sw/Liberica/releases/download/21.0.12.1%2B1/${RUNTIME_FILE//+/%2B}" -o "target/$RUNTIME_FILE"
          printf '%s  %s\n' "$RUNTIME_SHA256" "target/$RUNTIME_FILE" | sha256sum --check -
          if [[ "$RUNTIME_FILE" == *.zip ]]; then
            unzip -q "target/$RUNTIME_FILE" -d target/runtime32
          else
            tar -xf "target/$RUNTIME_FILE" -C target/runtime32
          fi
          python scripts/archive.py --payload target/distribution --runtime target/runtime32/jre-21.0.12.1 --platform "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: archive32-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/AJCoreGUI-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  release:
    needs: [package, flatpak, archive32]
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install virtual display for GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Build portable ZIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          xvfb-run -a mvn -B clean package
          python scripts/package.py prepare
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: target
      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          merge-multiple: true
          path: target
      - uses: actions/download-artifact@v8
        with:
          pattern: archive32-*
          merge-multiple: true
          path: target
      - name: Check all packages and ZIP
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            AJCoreGUI.zip \
            AJCoreGUI-macos-amd64.dmg \
            AJCoreGUI-macos-aarch64.dmg \
            AJCoreGUI-windows-amd64.exe \
            AJCoreGUI-windows-aarch64.exe \
            AJCoreGUI-linux-amd64.flatpak \
            AJCoreGUI-linux-aarch64.flatpak \
            AJCoreGUI-windows-x86.zip \
            AJCoreGUI-linux-x86.tar.gz \
            AJCoreGUI-linux-armhf.tar.gz; do
            test -s "target/$file"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: AJCoreGUI-packages
          path: |
            target/AJCoreGUI.zip
            target/*.dmg
            target/*.exe
            target/*.flatpak
            target/AJCoreGUI-*.tar.gz
            target/AJCoreGUI-windows-x86.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: aktuelles Changelog befindet sich [hier](https://github.com/applejuicenetz/gui-java/blob/${{ github.ref_name }}/CHANGELOG.md#changelog)
          fail_on_unmatched_files: true
          files: |
            target/AJCoreGUI.zip
            target/AJCoreGUI-macos-amd64.dmg
            target/AJCoreGUI-macos-aarch64.dmg
            target/AJCoreGUI-windows-amd64.exe
            target/AJCoreGUI-windows-aarch64.exe
            target/AJCoreGUI-linux-amd64.flatpak
            target/AJCoreGUI-linux-aarch64.flatpak
            target/AJCoreGUI-windows-x86.zip
            target/AJCoreGUI-linux-x86.tar.gz
            target/AJCoreGUI-linux-armhf.tar.gz

  notify-flatpak:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger flatpak repository sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_DISPATCH_TOKEN }}
        run: gh api repos/applejuicenetz/flatpak/dispatches -f event_type=flatpak-release

  notify-portable:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portable build
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_DISPATCH_TOKEN }}
        run: gh api repos/applejuicenetz/portable/dispatches -f event_type=portable-release
